version: "3.8"

services:
  server:
    image: akeedm/bookexchangeserver:latest
    ports:
      - "5001:5001"
    environment:
      DB_NAME: bookexchange
      DB_USER: akeed
      DB_PASSWORD: akeed123
      DB_HOST: db
      DB_PORT: 5432
      PORT: 5001
      JWT_SECRET: book_exchange_jwt
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:5001/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: akeedm/bookexchangeui:latest
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: akeed
      POSTGRES_PASSWORD: akeed123
      POSTGRES_DB: bookexchange
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U akeed -d bookexchange" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  postgres_data:


networks:
  app-net:
